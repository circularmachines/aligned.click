  // (tools/graphemes.py) approximates, so the number moves as the creator types
  // and the two only ever disagree on scripts neither product writes in.
  const SEGMENTER = typeof Intl !== "undefined" && Intl.Segmenter
    ? new Intl.Segmenter(undefined, { granularity: "grapheme" })
    : null;

  function countGraphemes(text) {
    if (SEGMENTER) return [...SEGMENTER.segment(text)].length;
    return [...text].length; // code points: wrong for flags and ZWJ emoji, but closer than .length
  }

  // A box you write a post into, with the counter that decides whether it can
  // be sent at all. Shared by a post card's reply and repost modes, because
  // both are the same thing — text on its way to becoming a record, under the
  // same 300-grapheme limit. Callers append their own buttons to `foot`, since
  // what the text is *for* differs and the box doesn't need to know.
  function composeBox({ text = "", limit = 300, placeholder = "" }) {
    const area = document.createElement("textarea");
    area.className = "compose-text";
    area.value = text;
    area.placeholder = placeholder;
    area.spellcheck = true;

    const foot = document.createElement("div");
    foot.className = "compose-foot";
    const counter = document.createElement("span");
    counter.className = "compose-count";
    foot.appendChild(counter);

    // A wrapper so a caller holding several boxes can show and hide them whole.
    // A caller that needs something between the text and the buttons can ignore
    // it and place `area` and `foot` itself.
    const wrap = document.createElement("div");
    wrap.className = "compose";
    wrap.append(area, foot);

    const update = () => {
      const n = countGraphemes(area.value);
      counter.textContent = `${n} / ${limit}`;
      // Over the limit shows on the counter alone while the buttons are inert.
      // When they go live they have to disable on this too — nothing above 300
      // can be published at all.
      counter.classList.toggle("over", n > limit);
      // Grow with the text: a reply you can only see four lines of is a reply
      // you cannot actually review.
      area.style.height = "auto";
      area.style.height = `${area.scrollHeight}px`;
    };
    area.addEventListener("input", update);
    // scrollHeight is 0 until the element is laid out, so size it once it is.
    requestAnimationFrame(update);
    update();

    return { wrap, area, foot, counter, update };
  }

  // Everything the assistant emits — answer text, reasoning, tool calls — is
  // ONE ordered list, rendered in the order it happened. It used to be two
  // separate lists concatenated as "every tool call, then all the text", which
  // put tools above answer text that came before them and threw the
  // interleaving away entirely.
  //
  // A part's kind isn't known when its first delta arrives (deltas carry only
  // `field: "text"`, which reasoning parts use too), so a block starts as text
  // and is reclassified when message.part.updated reveals what it is.
  function block(id, kind) {
    if (!(id in pending.blocks)) {
      pending.blocks[id] = { kind, text: "" };
      pending.blockOrder.push(id);
    }
    return pending.blocks[id];
  }

  // A reasoning block may open with a `[[label]]` saying what that step is
  // about — see AGENTS.md. Use it when it's there, and fall back to the first
  // line when it isn't: a model follows instructions in its *reasoning* channel
  // far less reliably than in its answer, and every box still needs a usable
  // heading. A turn produces one box per step, so identical summaries would
  // make them impossible to tell apart when scanning.
  // Label a collapsed box with the first line of its own reasoning. Asking the
  // model for an explicit label was tried and dropped: instructions aimed at
  // the reasoning channel are ignored outright, and moving them to the answer
  // channel produced labels that read worse than the reasoning's own opening.
  //
  // Long labels are cut without an ellipsis and faded out instead — see the
  // `.faded` rule, which masks the tail to transparent so the text dissolves
  // into the background rather than ending in a dot-dot-dot.
  const LABEL_MAX = 64;

  function thinkingHeading(text) {
    const first = ((text || "").split("\n").find((l) => l.trim()) || "")
      .trim()
      .replace(/^[#>*\-\s]+/, "");
    if (!first) return { text: "thinking", faded: false };
    return first.length > LABEL_MAX
      ? { text: first.slice(0, LABEL_MAX), faded: true }
      : { text: first, faded: false };
  }

  // Elements are cached on the block and reused, so re-rendering reorders
  // rather than rebuilds: an open thinking box stays open across the whole
  // stream and the final pass, and streamed text doesn't flicker.
  function blockElement(b, final) {
    if (b.kind === "tool") {
      // A completed render call shows as its cards instead of a trace line.
      // Built once and cached: <atproto-post> fetches the post itself, so
      // rebuilding it on every frame of the turn would refetch and flicker.
      if (b.render) {
        if (b.cardEl === undefined) {
          // A renderer that throws must cost its own card and nothing else.
          // Everything in the turn is drawn from one loop, so an exception here
          // used to blank every block after it — the reply text included.
          try {
            b.cardEl = renderElement(b.render, b.messageID);
          } catch (err) {
            console.error("render failed", b.render, err);
            b.cardEl = null; // falls through to the ordinary trace line
          }
        }
        if (b.cardEl) return b.cardEl;
      }
      b.el = b.el || Object.assign(document.createElement("div"), { className: "steps" });
      b.el.textContent = toolLine(b);
      return b.el;
    }
    if (b.kind === "reasoning") {
      if (!b.el) {
        b.el = document.createElement("details");
        b.el.className = "thinking";
        b.el.appendChild(document.createElement("summary"))
          .appendChild(document.createElement("span"));
        b.el.appendChild(document.createElement("div"));
      }
      const heading = thinkingHeading(b.text);
      b.el.firstChild.firstChild.textContent = heading.text;
      b.el.firstChild.firstChild.classList.toggle("faded", heading.faded);
      b.el.lastChild.textContent = b.text.trim();
      return b.el;
    }
    b.el = b.el || document.createElement("div");
    // Markdown live, not just at the end. The bubble is pre-wrap, so an
    // untouched leading newline from the model shows up as a blank line under
    // whatever block came before — trim it rather than styling around it.
    //
    // Covered spans are substituted into the source *before* it is parsed, not
    // painted over the result: what is rendered is then exactly what the record
    // says, bars and all, and there is no path where the page shows a bar and
    // publishes the words.
    const covered = applyRedactions(b.text.replace(/^\s+/, ""), redactions[b.messageID]);
    b.shown = covered.text;
    b.el.innerHTML = DOMPurify.sanitize(marked.parse(covered.text, { breaks: true }));
    // What the selection handler needs to turn a range back into source text,
    // and what a bar needs to know which span it stands for.
    blockOf.set(b.el, b);
    b.el.dataset.mid = b.messageID || "";
    if (covered.order.length) {
      paintRedactions(b.el, (bar, n) => {
        bar.title = "redacted — press to put the words back";
        bar.addEventListener("click", () => {
          const span = (redactions[b.messageID] || [])[covered.order[n]];
          if (span) setRedaction(b.messageID, span, true);
        });
      });
    }
    return b.el;
  }

  // ---- redaction ------------------------------------------------------------
  //
  // A model will say something wrong about a named person, and the choice
  // between publishing that and withholding the whole answer is a bad one. So a
  // span can be covered: select it, press Redact, and the words stop being part
  // of what this turn publishes — now, if the turn is already out.
  //
  // The page never sends replacement text, only the words to remove. A page
  // that could send text to publish could put sentences in the model's mouth
  // under its own label; a page that can only delete cannot.

  // The same three blocks the server writes. Fixed width: a bar as wide as the
  // words says how long the name was.
  const MARK = "███";
  // Which block object drew an element, so a DOM range can be read back as an
  // offset into the source the model actually produced.
  const blockOf = new WeakMap();

  // Source text with each covered span replaced, plus which span produced each
  // bar in the order the bars appear — that is what lets one be pressed to put
  // its words back.
  function applyRedactions(text, spans) {
    if (!spans || !spans.length) return { text, order: [] };
    const hits = [];
    spans.forEach((span, i) => {
      if (!span) return;
      for (let at = text.indexOf(span); at !== -1; at = text.indexOf(span, at + span.length)) {
        hits.push({ at, end: at + span.length, i });
      }
    });
    // Earliest first, longest first on a tie: one span inside another leaves a
    // single bar, not a bar with a fragment of the shorter one beside it.
    hits.sort((a, b) => a.at - b.at || b.end - a.end);
    let out = "", cursor = 0;
    const order = [];
    for (const hit of hits) {
      if (hit.at < cursor) continue;   // already inside a bar
      out += text.slice(cursor, hit.at) + MARK;
      order.push(hit.i);
      cursor = hit.end;
    }
    return { text: out + text.slice(cursor), order };
  }

  // Every text node of an element with its running offset, so a position in the
  // DOM becomes a number and both ends of a selection are measured the same way.
  function textIndex(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const parts = [];
    let total = 0, node;
    while ((node = walker.nextNode())) {
      parts.push({ node, start: total });
      total += node.textContent.length;
    }
    return { parts, text: parts.map((p) => p.node.textContent).join("") };
  }

  // Where each character on screen came from in the source.
  //
  // Rendered text is the source minus the markdown that produced it: every
  // visible character is a source character, in order, with the syntax skipped.
  // So walking both and stepping over what did not survive gives the source
  // position of anything selected — without re-parsing, and without asking
  // marked for positions it does not report.
  //
  // With one exception: whitespace the rendering added. marked separates the
  // elements it emits with newlines, so `</p>\n<ul>` puts a newline on screen
  // that the source never had — and the one after the last element has nothing
  // after it to align against at all. Markdown adds whitespace and drops
  // syntax; it never invents a word. So an unmatched space is stepped over and
  // an unmatched character is a refusal.
  //
  // Refusal, because there is no near-enough answer here: a span off by a few
  // characters redacts the wrong words and leaves the ones that were meant to
  // go.
  function sourcePositions(source, rendered) {
    const map = new Array(rendered.length);
    let j = 0;
    for (let i = 0; i < rendered.length; i++) {
      const c = rendered[i];
      if (/\s/.test(c)) {
        // Whitespace on screen is the source's if the source has some right
        // here, and the renderer's own layout if it does not. Never hunt
        // forward for it: `</li>\n<li>` draws a break between two list items
        // that the source writes as one newline, and looking ahead for a second
        // one steps straight over the words being selected.
        map[i] = j;
        if (j < source.length && /\s/.test(source[j])) j++;
        continue;
      }
      let k = j;
      while (k < source.length && source[k] !== c) k++;
      if (k >= source.length) return null;
      map[i] = k;
      j = k + 1;
    }
    return map;
  }

  // The source words a range covers inside one block, as pieces.
  //
  // Pieces, because a selection may run across a bar that is already there. The
  // parts between bars are the new words, and each is a literal run of the
  // source: substitution only changed what it replaced, so anything without a
  // bar in it is untouched source.
  function selectedSource(el, b, range) {
    const index = textIndex(el);
    let from = null, to = null;
    for (const p of index.parts) {
      if (!range.intersectsNode(p.node)) continue;
      const s = range.startContainer === p.node ? range.startOffset : 0;
      const e = range.endContainer === p.node ? range.endOffset : p.node.textContent.length;
      if (e <= s) continue;   // touched at a boundary, nothing of it selected
      if (from === null) from = p.start + s;
      to = p.start + e;
    }
    if (from === null || to <= from) return [];
    // Shrink to the words. A selection that ends on a line break would
    // otherwise be measured to a character the rendering invented, and the
    // pieces get trimmed at the end regardless.
    while (from < to && /\s/.test(index.text[from])) from++;
    while (to > from && /\s/.test(index.text[to - 1])) to--;
    if (to <= from) return [];
    // Only as far as the selection reaches: nothing after it can affect where
    // it starts and ends, and the tail is where the rendering's own whitespace
    // collects.
    const map = sourcePositions(b.shown || "", index.text.slice(0, to));
    if (!map) return null;
    return b.shown.slice(map[from], map[to - 1] + 1)
      .split(/█+/).map((piece) => piece.trim()).filter(Boolean);
  }

  const redactBtn = document.getElementById("redact-btn");
  let redactRange = null;

  function hideRedact() {
    redactBtn.hidden = true;
    redactRange = null;
  }

  // Blocks a range touches that can be redacted at all: the model's own words.
  // A tool trace is not published as text and a thinking box is not published
  // at all, so neither is registered here; the user's own turns are theirs to
  // withhold whole.
  function redactable(range) {
    const out = [];
    for (const el of log.querySelectorAll(".msg.assistant [data-mid]")) {
      const b = blockOf.get(el);
      if (!b || !b.messageID || !range.intersectsNode(el)) continue;
      out.push({ b, el });
    }
    return out;
  }

  document.addEventListener("selectionchange", () => {
    const sel = document.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return hideRedact();
    const range = sel.getRangeAt(0);
    if (!redactable(range).length) return hideRedact();
    redactRange = range.cloneRange();
    const rect = range.getBoundingClientRect();
    redactBtn.hidden = false;
    redactBtn.style.left =
      `${Math.min(Math.max(rect.left + rect.width / 2, 60), window.innerWidth - 60)}px`;
    redactBtn.style.top = `${Math.max(rect.top - 8, 44)}px`;
  });
  // The log scrolls under a fixed button, so a stale one would point at words
  // it no longer sits over.
  log.addEventListener("scroll", hideRedact);

  // Pressing must not take the selection away before it has been read.
  redactBtn.addEventListener("mousedown", (e) => e.preventDefault());
  redactBtn.addEventListener("click", async () => {
    const range = redactRange;
    const blocks = range ? redactable(range) : [];
    hideRedact();
    const jobs = [];
    for (const { b, el } of blocks) {
      const pieces = selectedSource(el, b, range);
      if (pieces === null) {
        addMessage("error", "Could not tell which words those are — select them "
                          + "again, whole words, and press Redact.");
        return;
      }
      for (const piece of pieces) jobs.push([b.messageID, piece]);
    }
    document.getSelection().removeAllRanges();
    for (const [mid, span] of jobs) await setRedaction(mid, span, false);
  });

  // The server decides, then the page redraws. Nothing is covered optimistically
  // — a bar the server did not accept would say the words are out of the record
  // when they are still in it.
  async function setRedaction(mid, span, remove) {
    if (!sessionID) return;
    try {
      const out = await fetch(`${SERVER}/redact`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session: sessionID, message: mid, text: span, remove }),
      }).then(async (r) => {
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || `${r.status}`);
        return j;
      });
      redactions = out.redacted || {};
      redrawMessage(mid);
      if (out.failed && out.failed.length) {
        addMessage("error", "Covered here, but the record was not rewritten: "
                          + out.failed[0].error);
      }
    } catch (err) {
      addMessage("error", `Could not redact: ${err.message}`);
    }
  }

  function redrawMessage(mid) {
    for (const el of log.querySelectorAll(`[data-mid="${CSS.escape(mid)}"]`)) {
      const b = blockOf.get(el);
      if (!b) continue;
      // Cards drawn from a `[3]` in the prose are part of what the re-render
      // throws away, so put them back — and only where there were some, so a
      // redaction never adds a card the message did not already have.
      const hadCards = !!el.querySelector("atproto-post");
      blockElement(b, true);
      if (!hadCards) continue;
      const bubble = el.closest(".bubble") || el;
      embedPostRefs(el, new Set([...bubble.querySelectorAll("atproto-post")]
        .map((p) => p.getAttribute("src"))));
    }
  }

  // Deltas arrive far faster than the screen refreshes, and each one now
  // re-parses markdown. Coalescing streamed renders onto an animation frame
  // caps that at the display rate — the text still appears live, without
  // parsing the same growing string a dozen times per visible update. The
  // final render runs immediately: it must not be dropped or deferred.
  let renderQueued = false;

  function renderPending(final = false) {
    if (!pending) return;
    if (!final) {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        if (pending) drawPending(false);
      });
      return;
    }
    drawPending(true);
  }

  function drawPending(final) {
    const wasPinned = isPinnedToBottom();
    const children = [];
    // What the tool calls in this turn have already drawn. The prose scanner
    // below skips these, so a reply that both calls show-post and mentions
    // `[3]` gets one card, not two — which is what lets the old prose path stay
    // as a fallback without the model needing a rule about it.
    const drawn = new Set();
    for (const id of pending.blockOrder) {
      const b = pending.blocks[id];
      // Cards a tool asked for are content, not trace — they stay visible
      // whether or not the step trace is switched on.
      if (b.kind === "tool" && !b.render && !SETTINGS.showSteps) continue;
      if (b.kind === "reasoning" && !SETTINGS.showReasoning) continue;
      if (b.kind === "text" && !b.text.trim()) continue;
      // Scoped to the kind that actually has post URIs. Reading `.posts` off
      // any payload cost a whole turn once: the actor card carries a post
      // *count* under that name, and `for (const p of 5039)` threw here and
      // took every block after it down with it. Payload fields only mean
      // something within their own kind.
      if (b.kind === "tool" && b.cardEl && b.render.kind === "posts") {
        for (const post of b.render.posts || []) if (post.uri) drawn.add(post.uri);
      }
      children.push(blockElement(b, final));
    }
    if (children.length) {
      // Patch the child list in place rather than replaceChildren(). A card is
      // created the moment its tool call completes, so it sits in the bubble
      // for the rest of the turn — and <atproto-post> aborts its in-flight
      // fetch when it is disconnected and never restarts it. replaceChildren
      // detaches and reattaches *every* child on *every* frame, which left the
      // cards stuck in their loading skeleton forever. (The old prose-scraped
      // embeds never hit this: they were only ever created on the final render,
      // after the last replaceChildren.)
      const bubble = pending.bubble;
      for (let i = 0; i < children.length; i++) {
        const at = bubble.childNodes[i];
        if (at === children[i]) continue;
        if (at) bubble.insertBefore(children[i], at);
        else bubble.appendChild(children[i]);
      }
      while (bubble.childNodes.length > children.length) bubble.lastChild.remove();
    } else {
      const elapsed = SETTINGS.showElapsedTime ? ` (${Math.round((Date.now() - pending.startTime) / 1000)}s)` : "";
      pending.bubble.textContent = `…${elapsed}`;
    }
    // Post cards are embedded once, over the whole bubble, so the same post
    // referenced from two text blocks still renders a single card.
    if (final && embedPostRefs(pending.bubble, drawn)) pending.wrap.classList.add("has-embed");
    scrollToBottomIfPinned(wasPinned);
  }

  function addLabel(text) {
    if (pending.labelAdded) return;
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = text;
    pending.wrap.appendChild(label);
    pending.labelAdded = true;
  }

  // Tool output follows the convention documented in AGENTS.md:
  // `[3] @handle (N likes) at://... — preview`. Scraping that line lets the
  // agent's reply just say `[3]` — short, and it can't mangle the URI.
  const INDEX_REF_RE = /\[(\d+)\][^\n]*?(at:\/\/\S+)/g;

  function scanForPostIndices(output) {
    for (const [, idx, uriRaw] of output.matchAll(INDEX_REF_RE)) {
      postIndex[idx] = uriRaw.replace(/[.,!?;:)\]}'"]+$/, "");
    }
  }

  // Matches either an index (resolved via postIndex) or a raw at:// URI
  // directly, in case the model includes one anyway.
  //
  // `#2443` is matched as well as `[2443]`. Told not to write `[N]`, this model
  // started writing `#N` instead — it wants to label the thing it just showed,
  // and forbidding one spelling only moves it to the next. Only a number that
  // resolves to a post we actually drew is touched, and `(?<![\w#])` keeps
  // `ig#3` (a creator item) out of it.
  const POST_REF_RE = /\[(\d+)\]|(?<![\w#])#(\d+)|(at:\/\/[^\s<>"']+)/g;

  function embedPostRefs(root, alreadyDrawn) {
    let hasEmbed = false;
    // Resolved URIs already embedded in this message. The agent often pastes
    // whole tool-output lines that contain BOTH the [N] index and the raw
    // at:// URI for the same post — without this we'd render two identical
    // cards. Dedupe per message so each post shows once. Posts a show-post
    // call already drew are handled separately below — they keep their text.
    const seen = new Set();
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        // `.steps` and `.thinking` are excluded: raw tool output routinely
        // contains `[N]` lines, and a trace is a trace — it should stay text,
        // not sprout post cards.
        return node.parentElement && node.parentElement.closest("code, pre, .steps, .thinking")
          ? NodeFilter.FILTER_REJECT
          : NodeFilter.FILTER_ACCEPT;
      },
    });
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);

    for (const textNode of textNodes) {
      const text = textNode.textContent;
      // Groups: 1 = `[N]`, 2 = `#N`, 3 = a raw at:// URI.
      const idxOf = (m) => (m[1] !== undefined ? m[1] : m[2]);
      const matches = [...text.matchAll(POST_REF_RE)].filter(
        (m) => m[3] !== undefined || postIndex[idxOf(m)] !== undefined,
      );
      if (matches.length === 0) continue;

      const frag = document.createDocumentFragment();
      let lastIndex = 0;
      for (const m of matches) {
        let uri, trailing = "";
        if (m[3] !== undefined) {
          [, uri, trailing] = m[3].match(/^(.*?)([.,!?;:)\]}'"]*)$/s);
        } else {
          uri = postIndex[idxOf(m)];
        }
        if (m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
        if (alreadyDrawn && alreadyDrawn.has(uri)) {
          // The card is on screen already, so this is a leftover label in the
          // prose: a number the reader has never seen and cannot look up.
          // Substituted rather than deleted, because the model writes it as the
          // subject of the sentence ("[2408] stood out for…") and cutting it
          // leaves a fragment. This is only a patch over the real problem —
          // the note belongs immediately after the call that drew the card,
          // where it needs no subject at all.
          frag.appendChild(document.createTextNode("This post"));
        } else if (seen.has(uri)) {
          // Same post already shown in this message — drop this duplicate
          // token (also removes the raw at:// URL clutter) instead of
          // rendering a second identical card.
          if (trailing) frag.appendChild(document.createTextNode(trailing));
        } else {
          seen.add(uri);
          const el = document.createElement("atproto-post");
          el.setAttribute("src", uri);
          frag.appendChild(el);
          if (trailing) frag.appendChild(document.createTextNode(trailing));
          hasEmbed = true;
        }
        lastIndex = m.index + m[0].length;
      }
      if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      textNode.replaceWith(frag);
    }
    return hasEmbed;
  }

  function finalizePending() {
    if (!pending) return;
    clearInterval(pending.tickTimer);
    const { resolve } = pending;
    // The bubble knows which assistant messages went into it, so say so rather
    // than letting anything work it out later.
    if (pending.wrap && pending.assistantIDs.size) {
      pending.wrap.dataset.mids = [...pending.assistantIDs].join(",");
    }
    renderPending(true);
    const finished = pending;
    pending = null;
    if (resolve) resolve();
    syncTurns();
  }

  // opencode occasionally never starts a turn at all after a follow-up
  // message — no assistant message, no error event, nothing — leaving the
  // UI stuck on "…" forever. Abort and surface it instead of hanging.
  function timeoutPending() {
    if (!pending) return;
    clearInterval(pending.tickTimer);
    const { wrap, resolve } = pending;
    wrap.classList.add("error");
    // Appended as its own block so the trace collected so far survives — the
    // steps leading up to a stall are the whole reason to look at it.
    block("timeout", "text").text =
      `\nError: no activity for ${SETTINGS.idleTimeoutSeconds}s — aborted (the turn stalled, not just slow). Try sending it again.`;
    renderPending(true);
    fetch(`${SERVER}/session/${sessionID}/abort`, { method: "POST" }).catch(() => {});
    pending = null;
    if (resolve) resolve();
  }

  // Single persistent SSE connection for the page's lifetime; events are
  // matched against `sessionID` and the in-flight `pending` reply, so
  // switching sessions ("New chat") just changes what's listened for.
  const events = new EventSource(`${SERVER}/event`);
  events.onmessage = (e) => {
    let evt;
    try {
      evt = JSON.parse(e.data);
    } catch {
      return;
    }
    if (SETTINGS.logEventsToConsole) console.debug("[opencode]", evt.type, evt.properties);
    if (!pending) return;
    const props = evt.properties || {};
    if (props.sessionID !== sessionID) return;
    // Any event for this turn counts as activity — the idle-timeout clock
    // (below) resets here, so a long multi-step turn that keeps streaming
    // tool calls and text stays alive; only a genuine stall trips it.
    pending.lastActivity = Date.now();

    if (evt.type === "session.idle") {
      finalizePending();
      return;
    }

    if (evt.type === "message.updated") {
      const info = props.info;
      if (info.role !== "assistant") return;
      pending.assistantIDs.add(info.id);
      if (info.providerID || info.modelID) addLabel(`${info.providerID}/${info.modelID}`);
      if (info.error) {
        pending.wrap.classList.add("error");
        block("error", "text").text = `\n[error: ${info.error.name || JSON.stringify(info.error)}]`;
        finalizePending();
      }
      return;
    }

    if (evt.type === "message.part.delta") {
      if (!pending.assistantIDs.has(props.messageID)) return;
      if (props.field !== "text") return;
      const b = block(props.partID, "text");
      // Which turn's words these are — a redaction is stored against the
      // message, and the bubble may hold several.
      b.messageID = props.messageID;
      b.text += props.delta || "";
      renderPending();
      return;
    }

    if (evt.type === "message.part.updated") {
      const part = props.part;
      if (!pending.assistantIDs.has(part.messageID)) return;
      if (part.type === "text" || part.type === "reasoning") {
        const b = block(part.id, part.type);
        b.kind = part.type;  // a delta may have created it as text before we knew
        b.messageID = part.messageID;
        b.text = part.text || "";
        renderPending();
      } else if (part.type === "tool") {
        // Keyed by callID (prefixed, so it can't collide with a part id) —
        // the same call is updated repeatedly as it runs and completes.
        const b = block(`tool:${part.callID}`, "tool");
        // Which turn drew this. A draft card offers to link back to the turn
        // that proposed it, and only the event knows which that is.
        b.messageID = part.messageID;
        b.tool = part.tool;
        b.status = part.state && part.state.status;
        if (part.state && part.state.input) b.inputSummary = summarizeInput(part.state.input);
        if (part.state && part.state.status === "error") {
          b.error = typeof part.state.error === "string"
            ? part.state.error
            : JSON.stringify(part.state.error);
        }
        if (part.state && part.state.status === "completed" && part.state.output) {
          scanForPostIndices(part.state.output);
          b.render = parseRender(part.state.output);
          b.outputPreview = part.state.output.slice(0, SETTINGS.toolOutputPreviewChars);
        }
        renderPending();
      }
    }
  };

  async function sendMessage(text) {
    addMessage("user", text);
    setBusy(true);
    const bubble = addMessage("assistant", "…");

    pending = {
      // Message IDs of the assistant messages this turn produces. A prompt
      // can span several assistant messages (one per tool-call step, then a
      // final text one), and the user's own echoed message arrives as parts
      // too — so we only render parts whose messageID is in this set.
      assistantIDs: new Set(),
      bubble,
      wrap: bubble.parentElement,
      // One ordered list of everything the assistant emits — text, reasoning
      // and tool calls together, in arrival order. See block().
      blockOrder: [],
      blocks: {},
      startTime: Date.now(),
      lastActivity: Date.now(),
      tickTimer: null,
      labelAdded: false,
      resolve: null,
    };
    // Keeps the elapsed-time readout moving even when no events arrive at
    // all — the difference between "still working" and "actually stuck" —
    // and gives up only after idleTimeoutSeconds of *no activity at all*
    // (not total turn length), so a long multi-step turn that keeps
    // streaming stays alive while a real hang still gets aborted.
    pending.tickTimer = setInterval(() => {
      if (!pending) return;
      if ((Date.now() - pending.lastActivity) / 1000 > SETTINGS.idleTimeoutSeconds) {
        timeoutPending();
      } else {
        renderPending();
      }
    }, 1000);

    try {
      // IMPORTANT: do NOT pass a client-generated `messageID` here. Doing so
      // wedges the *second* and later turns of a session — opencode accepts
      // the prompt (204) but silently never starts the assistant turn. Let
      // the server assign the id (reproduced and confirmed against 1.16.2).
      const body = { parts: [{ type: "text", text }], tools: chosenTools() };
      // A product run uses its own agent, whose system prompt is the product's
      // definition. Without this the session falls back to the generic agent,
      // which knows the tools but not what it is supposed to produce.
      // A product names its own agent — its system prompt is the product. Only
      // when there is no product does the dropdown decide, so the two cannot
      // quietly override each other.
      const agent = PRODUCT || agentPick.value;
      if (agent) body.agent = agent;
      // The model the dropdown is showing, sent with the prompt rather than
      // set anywhere. With nothing chosen the field is left off and
      // opencode.json decides, which is still the answer for anyone who never
      // touches the control.
      //
      // The header cannot end up crediting the wrong model for an answer even
      // though the page names one: the label under each reply comes from
      // opencode's own message, so if the server refused or substituted, that
      // is what shows.
      const model = chosenModel();
      if (model) body.model = model;
      const res = await fetch(`${SERVER}/session/${sessionID}/prompt_async`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error(`${res.status} ${res.statusText} ${body}`.trim());
      }
      // Response is 204 — the reply streams in via the /event SSE connection
      // above and finalizePending() resolves this once it completes.
      await new Promise((resolve) => {
        pending.resolve = resolve;
      });
    } catch (err) {
      clearInterval(pending.tickTimer);
      pending.wrap.classList.add("error");
      pending.bubble.textContent = `Error: ${err.message}`;
      pending = null;
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !sessionID) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = `${input.scrollHeight}px`;
  });

  newChatBtn.addEventListener("click", () => newSession());
  stopBtn.addEventListener("click", () => stopPending());

  // Wanted before the first prompt can be sent, not before the session exists,
  // so it loads alongside rather than in front of it.
  loadSetup();
  loadSettings().then(newSession);
</script>
</body>
</html>
